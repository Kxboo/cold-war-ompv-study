<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
<title id="title">OMPV: four control samples combine into two distinct materials</title>
<desc id="desc">Synthetic 2 by 2 control map at texel-centre position (0.25, 0.75), equivalent to normalized UV (0.375, 0.625). Top-left: ID 7, weight (1-x)(1-y) = 0.1875. Top-right: ID 7, weight x(1-y) = 0.0625. Bottom-left: ID 2, weight (1-x)y = 0.5625. Bottom-right: ID 7, weight xy = 0.1875. Matching IDs combine: material 2 receives 0.5625; material 7 receives 0.1875 + 0.0625 + 0.1875 = 0.4375. Both bars use the same zero-to-one scale. Material 7 is segmented by its three source samples. Numeric layer order is 2 then 7. Total bilinear coverage is 1. This is coverage before reveal, not the final compositing weight. Colours only identify materials; no game textures are included.</desc>
<rect x="1" y="1" width="1118" height="698" rx="18" fill="#f5f3ec" stroke="#cbd1c0" stroke-width="2"/>
<text x="32" y="36" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#596451" text-anchor="start" letter-spacing="1.5">SYNTHETIC OMPV / GATHER + COMBINE</text>
<text x="32" y="82" font-family="Georgia, serif" font-size="38" font-weight="normal" fill="#263027" text-anchor="start">Four samples. Two distinct materials.</text>
<text x="32" y="118" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#596451" text-anchor="start">Keep the IDs categorical. Add the weights only when the IDs match.</text>
<path d="M32 143L1088 143" fill="none" stroke="#cbd1c0" stroke-width="1"/>
<text x="32" y="181" font-family="Consolas, Menlo, monospace" font-size="16" font-weight="normal" fill="#a34b27" text-anchor="start">01</text>
<text x="70" y="181" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#263027" text-anchor="start">Gather four control samples</text>
<text x="32" y="213" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#596451" text-anchor="start">Local fractions: x = 0.25, y = 0.75</text>
<text x="464" y="181" font-family="Consolas, Menlo, monospace" font-size="16" font-weight="normal" fill="#a34b27" text-anchor="start">02</text>
<text x="502" y="181" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#263027" text-anchor="start">Combine, then sort by ID</text>
<text x="464" y="213" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#596451" text-anchor="start">Bilinear coverage · both bars use a 0–1 scale</text>
