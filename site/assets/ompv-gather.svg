<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" role="img" aria-labelledby="title desc">
<title id="title">OMPV gathers IDs and combines their coverage</title>
<desc id="desc">Synthetic example: IDs 7,7,2,7 have weights 0.1875,0.0625,0.5625,0.1875. Material 2 combines to 0.5625, material 7 to 0.4375.</desc>
<rect width="1120" height="400" rx="16" fill="#101b29"/>
<g font-family="Arial, sans-serif" fill="#ecf2fa">
<text x="32" y="42" font-size="25" font-weight="bold">Four control samples, two material evaluations</text>
<text x="32" y="70" font-size="15" fill="#b3c5da">Synthetic OMPV example · p = (0.25, 0.75) in texel-centre coordinates</text>
<rect x="32" y="98" width="126" height="104" rx="8" fill="#eab15c"/>
<text x="46" y="133" font-size="26" fill="#101b29" font-weight="bold">ID 7</text>
<text x="46" y="170" font-size="17" fill="#101b29">w = 0.1875</text>
<rect x="170" y="98" width="126" height="104" rx="8" fill="#eab15c"/>
<text x="184" y="133" font-size="26" fill="#101b29" font-weight="bold">ID 7</text>
<text x="184" y="170" font-size="17" fill="#101b29">w = 0.0625</text>
<rect x="32" y="214" width="126" height="104" rx="8" fill="#83b8f2"/>
<text x="46" y="249" font-size="26" fill="#101b29" font-weight="bold">ID 2</text>
<text x="46" y="286" font-size="17" fill="#101b29">w = 0.5625</text>
<rect x="170" y="214" width="126" height="104" rx="8" fill="#eab15c"/>
<text x="184" y="249" font-size="26" fill="#101b29" font-weight="bold">ID 7</text>
<text x="184" y="286" font-size="17" fill="#101b29">w = 0.1875</text>
<path d="M325 208 H420 M408 198 L420 208 L408 218" stroke="#b3c5da" stroke-width="3" fill="none"/>
<text x="335" y="174" font-size="16">combine</text>
<text x="335" y="245" font-size="16">and sort</text>
<text x="454" y="115" font-size="20" font-weight="bold">Material 2</text>
<rect x="454" y="131" width="530" height="34" rx="5" fill="#27384d"/>
<rect x="454" y="131" width="298.125" height="34" rx="5" fill="#83b8f2"/>
<text x="1000" y="155" font-size="18">0.5625</text>
<text x="454" y="225" font-size="20" font-weight="bold">Material 7</text>
<rect x="454" y="241" width="530" height="34" rx="5" fill="#27384d"/>
<rect x="454" y="241" width="231.875" height="34" rx="5" fill="#eab15c"/>
<text x="1000" y="265" font-size="18">0.4375</text>
<text x="454" y="321" font-size="15" fill="#b3c5da">Coverage sums to 1. Reveal is a later operation.</text>
<text x="32" y="372" font-size="15" fill="#b3c5da">Integer IDs stay categorical. Colour controls follow their associated material.</text>
</g></svg>
